# 一般例。wt setup が worktree に docker-compose.devenv.yml としてコピーし、
# .envrc の COMPOSE_FILE で上流の compose に重ねる。${APP_HOST} は .envrc から展開される。
# 上流リポジトリのファイルは変更しない。
services:
  app:
    ports: !reset []                     # ホスト publish をやめ Caddy 経由にする
    networks:
      - default
      - devproxy
    labels:
      # caddy_0: HTTPS（tls internal。ブラウザで警告なしに開くには wt trust）
      caddy_0: ${APP_HOST}
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_0.tls: internal
      # caddy_1: HTTP 併設（CA 未信頼のブラウザ向け。リダイレクトしない）
      caddy_1: http://${APP_HOST}
      caddy_1.reverse_proxy: "{{upstreams 3000}}"
    environment:                         # 上流の環境変数名に合わせて書き換える
      APP_HOST: ${APP_HOST}
      APP_PORT: "443"
      ASSET_HOST: https://${APP_HOST}
  worker:
    environment:
      APP_HOST: ${APP_HOST}
      APP_PORT: "443"
      ASSET_HOST: https://${APP_HOST}
  db:
    ports: !reset []                     # GUI から繋ぐときは docker compose port db 3306
  tunnel:
    profiles: [devenv-off]               # 既定で起動しない

networks:
  devproxy:
    external: true
